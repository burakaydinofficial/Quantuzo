# Runtime Configuration
# =====================
# Base settings for all benchmark runs.
# Model configs can override these values.

# Context size per slot (each conversation gets this much context)
# Total allocated = CTX_SIZE * PARALLEL
# Note: Results with different context sizes are not directly comparable
CTX_SIZE=65536

# CPU thread settings (ignored when using GPU with full offload)
# THREADS: used during token generation (memory-bound, diminishing returns beyond ~50% of cores)
# THREADS_BATCH: used during prompt processing (compute-bound, scales better, can use ~75% of cores)
THREADS=16
THREADS_BATCH=8

# Evaluation parallelism
EVAL_WORKERS=8

# llama-server parallel slots (concurrent request processing)
# Each slot allocates full CTX_SIZE of KV cache memory
PARALLEL=1

# SWE-agent parallel workers (concurrent instance processing)
# Higher values = more instances processed simultaneously
# Requires sufficient model server capacity (PARALLEL slots)
WORKERS=1

# Flash attention mode for GPU inference
# Options: auto, on, off
# - auto: detect hardware support (may fail with some KV cache types)
# - on: force enable
# - off: disable
# Note: q4_1, q5_0, q5_1 and asymmetric types (q8-q4, f16-q8, f16-q4) require --cuda124 to work correctly.
FLASH_ATTN=on

# Prompt cache RAM limit in MiB (llama-server --cache-ram)
# Controls how much memory the server uses for caching previous prompts.
# Larger values allow more/bigger cached prompts, reducing eviction pressure.
# Set to 0 to disable prompt caching, -1 for no limit.
CACHE_RAM=0

# Extra arguments for llama-server
# Example: EXTRA_LLAMA_ARGS="-nkvo" to offload KV cache to CPU
EXTRA_LLAMA_ARGS=
